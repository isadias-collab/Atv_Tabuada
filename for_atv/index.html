<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Atividade For</title>
</head>
<body>
    <h1>Painel de Tabuada</h1>
    <button onclick="gerarTabuadas()">Gerar Tabuada</button>

    <div id="resultado"></div>

    <script>
    function gerarTabuadas() {

    let painel = document.getElementById("resultado");
    let conteudo = ""; 

    for (let i = 1; i <= 10; i++) { 
        conteudo += `<div class="card">`;
        conteudo += `<h3>Tabuada do ${i}</h3>`;

        for (let j = 1; j <= 10; j++) { 
            let resultado = i * j;
            conteudo += `${i} x ${j} = ${resultado}<br>`;
        }

        conteudo += `</div>`;
    }

    painel.innerHTML = conteudo; 
}
</script>
    
</body>
</html>
